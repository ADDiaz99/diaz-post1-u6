spring.application.name=pedidos-service

# H2 en memoria. MODE=LEGACY es obligatorio para el GestorPedidos de la guía:
# usa "CALL IDENTITY()", y H2 2.x solo acepta IDENTITY() en el modo LEGACY.
spring.datasource.url=jdbc:h2:mem:pedidos;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=

# schema.sql y data.sql se ejecutan siempre al arrancar.
spring.sql.init.mode=always
